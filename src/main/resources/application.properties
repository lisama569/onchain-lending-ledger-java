server.port=0

# 账本快照持久化路径（原子写：临时文件 + rename）
ledger.snapshot-path=data/ledger-snapshot.json
# 空账本启动时引导的资金池
ledger.bootstrap-assets=ETH,USDC
# 价格有效期（毫秒）：超过该年龄的报价视为过期，不参与健康度/清算
ledger.price-ttl-millis=60000
# 相邻已接受报价允许的最大相对波动（防异常抖动/插针误清算）
ledger.max-price-deviation=0.50
# 各资产抵押因子（LTV）：存款按此比例计入可借额度；未配置资产抵押价值为 0
ledger.collateral-factors.ETH=0.75
ledger.collateral-factors.USDC=0.80
# 清算阈值：健康度低于该值才允许清算
ledger.liquidation-threshold=1.00
# 清算奖励：清算人按 (1+bonus) 的价值比例取得抵押品
ledger.liquidation-bonus=0.08
# 单次清算最多覆盖借款人总债务价值的比例
ledger.max-close-factor=0.50

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
